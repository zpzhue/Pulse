    <style id="theme-vars">
/* ============================================================
   Pulse - Brand CSS
   Style: Dark Tech / Cyber-Cyan
   Prefix: ydl
   ============================================================ */

/* ---- Design Tokens ---- */
:root {
  /* Required primary + foreground */
  --ydl-primary-500: #00c9e0;
  --ydl-primary-foreground: #0b0b14;

  /* Primary scale tints */
  --ydl-primary-hue: 188;
  --ydl-primary-sat: 100%;
  --ydl-primary-light: 44%;
  --ydl-primary-50: #e6fcff;
  --ydl-primary-100: #b3f7ff;
  --ydl-primary-200: #80f0ff;
  --ydl-primary-300: #4de8ff;
  --ydl-primary-400: #1adfff;
  --ydl-primary-600: #00a3b8;
  --ydl-primary-700: #007d8c;
  --ydl-primary-800: #005760;
  --ydl-primary-900: #003238;

  /* Neutral scale (cool gray with slight blue tint) */
  --ydl-neutral-50: #f4f5fa;
  --ydl-neutral-100: #e5e7f0;
  --ydl-neutral-200: #c8cad8;
  --ydl-neutral-300: #a3a5b8;
  --ydl-neutral-400: #7a7d95;
  --ydl-neutral-500: #5a5d75;
  --ydl-neutral-600: #43455a;
  --ydl-neutral-700: #313346;
  --ydl-neutral-800: #222435;
  --ydl-neutral-900: #161825;
  --ydl-neutral-950: #0b0b14;

  /* State colors (semantic only, not brand) */
  --state-success: #2ebe85;
  --state-warning: #f5a623;
  --state-error: #f56565;
  --state-info: #4da3ff;

  /* Radius scale (restrained) */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui;
  --font-mono: "JetBrains Mono", "Fira Code", Consolas, monospace;
  --font-display: "Inter", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;

  /* Shadows (static ≤ 0.05 alpha; floating may be deeper) */
  --shadow-static: 0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 1px rgba(0, 0, 0, 0.03);
  --shadow-float: 0 8px 24px -8px rgba(0, 0, 0, 0.4);
  --shadow-overlay: 0 24px 60px -20px rgba(0, 0, 0, 0.6);

  /* Spacing (8pt grid) */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* ---- Semantic Aliases (Light mode baseline) ---- */
  --ydl-background: var(--ydl-neutral-50);
  --ydl-foreground: var(--ydl-neutral-900);
  --ydl-card: #ffffff;
  --ydl-card-foreground: var(--ydl-neutral-900);
  --ydl-popover: #ffffff;
  --ydl-popover-foreground: var(--ydl-neutral-900);
  --ydl-primary: var(--ydl-primary-500);
  --ydl-muted: var(--ydl-neutral-100);
  --ydl-muted-foreground: var(--ydl-neutral-500);
  --ydl-border: var(--ydl-neutral-200);
  --ydl-input: var(--ydl-neutral-200);
  --ydl-ring: var(--ydl-primary-500);

  --ydl-radius-small: var(--radius-sm);
  --ydl-radius-medium: var(--radius-md);
  --ydl-radius-large: var(--radius-lg);

  /* Extended light surface tokens */
  --ydl-surface: #ffffff;
  --ydl-surface-2: #f4f5fa;
  --ydl-surface-3: #e5e7f0;
  --ydl-link: #161825;
  --ydl-link-2: #5a5d75;
  --ydl-link-3: #7a7d95;
  --ydl-line: #c8cad8;

  /* Light-optimized shadows */
  --shadow-static: 0 1px 2px rgba(0,0,0,.03), 0 1px 1px rgba(0,0,0,.02);
  --shadow-float: 0 4px 16px -4px rgba(0,0,0,.08);
  --shadow-overlay: 0 12px 40px -8px rgba(0,0,0,.12);
}

/* ---- Dark Mode (primary theme) ---- */
.dark {
  --ydl-background: #0b0b14;
  --ydl-foreground: #e8eaf6;
  --ydl-card: #13131e;
  --ydl-card-foreground: #e8eaf6;
  --ydl-popover: #1a1a2b;
  --ydl-popover-foreground: #e8eaf6;
  --ydl-primary: #00c9e0;
  --ydl-primary-foreground: #0b0b14;
  --ydl-muted: #1b1b2b;
  --ydl-muted-foreground: #9090b0;
  --ydl-border: #252538;
  --ydl-input: #252538;
  --ydl-ring: #00c9e0;

  /* Extended dark surface tokens for layered depth */
  --ydl-surface: #13131e;
  --ydl-surface-2: #1b1b2b;
  --ydl-surface-3: #252538;
  --ydl-line: #252538;
  --ydl-link: #e8eaf6;
  --ydl-link-2: #9090b0;
  --ydl-link-3: #5a5d7a;

  --shadow-static: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03);
  --shadow-float: 0 8px 24px -8px rgba(0,0,0,.4);
  --shadow-overlay: 0 24px 60px -20px rgba(0,0,0,.6);
}

/* ---- Typography Classes ---- */
.font-display { font-family: var(--font-display); }
.font-sans { font-family: var(--font-sans); }
.font-mono { font-family: var(--font-mono); }

.text-display { font-size: clamp(32px, 4vw, 48px); line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; }
.text-h1 { font-size: clamp(24px, 3vw, 36px); line-height: 1.2; font-weight: 600; letter-spacing: -0.015em; }
.text-h2 { font-size: clamp(20px, 2.2vw, 28px); line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; }
.text-h3 { font-size: 18px; line-height: 1.4; font-weight: 600; }
.text-body { font-size: 14px; line-height: 1.6; font-weight: 400; }
.text-body-sm { font-size: 13px; line-height: 1.55; font-weight: 400; }
.text-caption { font-size: 12px; line-height: 1.5; font-weight: 400; }
.text-mono { font-size: 13px; line-height: 1.5; font-weight: 500; font-family: var(--font-mono); }

  @theme inline {

    --color-muted: var(--ydl-muted);
    --color-muted-foreground: var(--ydl-muted-foreground);
    --color-border: var(--ydl-border);
    --color-input: var(--ydl-input);

    --radius-sm: var(--ydl-radius-small);

  @layer base {
    body { background: var(--ydl-background); color: var(--ydl-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

    <style id="critical-layout">
      /* ===== Critical Layout (survives without Tailwind) ===== */
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--ydl-background); color: var(--ydl-foreground); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }

      /* Shell */
      .ydl-shell { display: flex; height: 100vh; overflow: hidden; background: var(--ydl-background); color: var(--ydl-foreground); }
      .ydl-sidebar { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--ydl-border); background: var(--ydl-card); }
      .ydl-brand { display: flex; align-items: center; gap: 10px; padding: 0 20px; height: 56px; border-bottom: 1px solid var(--ydl-border); }
      .ydl-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
      .ydl-nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px; color: var(--ydl-muted-foreground); text-decoration: none; transition: background-color 160ms cubic-bezier(.2,.8,.2,1), color 160ms; }
      .ydl-nav-item:hover { background: var(--ydl-muted); color: var(--ydl-foreground); }
      .ydl-nav-item.ydl-nav-active { background: var(--ydl-muted); color: var(--ydl-primary); font-weight: 500; }
      .ydl-nav-item.ydl-nav-active svg { color: var(--ydl-primary); }
      .ydl-main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .ydl-topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 56px; border-bottom: 1px solid var(--ydl-border); flex-shrink: 0; background: var(--ydl-card); }
      .ydl-main { flex: 1; overflow-y: auto; padding: 24px; }

      /* Panel + labels */
      .ydl-panel { background: var(--ydl-card); border: 1px solid var(--ydl-border); border-radius: 16px; padding: 24px; }
      .ydl-panel-sm { background: var(--ydl-card); border: 1px solid var(--ydl-border); border-radius: 16px; padding: 18px; }
      .ydl-label { display: block; font-size: 13px; font-weight: 500; color: var(--ydl-foreground); margin-bottom: 8px; }
      .ydl-hint { font-size: 12px; color: var(--ydl-muted-foreground); display: flex; align-items: center; gap: 6px; }
      .ydl-divider { height: 1px; background: var(--ydl-border); margin: 20px 0; border: 0; }
      .ydl-section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }

      /* Inputs */
      .ydl-input { width: 100%; background: var(--ydl-card); border: 1px solid var(--ydl-border); border-radius: 8px; color: var(--ydl-foreground); font-family: var(--font-sans); font-size: 14px; transition: border-color 160ms, box-shadow 160ms; }
      .ydl-input::placeholder { color: var(--ydl-muted-foreground); }
      .ydl-input:hover { border-color: var(--ydl-muted-foreground); }
      .ydl-input:focus { outline: none; border-color: var(--ydl-primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ydl-ring) 22%, transparent); }

      /* Select */
      .ydl-select { width: 100%; height: 44px; background: var(--ydl-card); border: 1px solid var(--ydl-border); border-radius: 8px; color: var(--ydl-foreground); font-size: 14px; padding: 0 36px 0 12px; appearance: none; -webkit-appearance: none; cursor: pointer; transition: border-color 160ms, box-shadow 160ms; }
      .ydl-select:hover { border-color: var(--ydl-muted-foreground); }
      .ydl-select:focus { outline: none; border-color: var(--ydl-primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ydl-ring) 22%, transparent); }
      .ydl-select option { background: var(--ydl-card); color: var(--ydl-foreground); }

      /* Inline select wrap (batch bar) */
      .select-wrap { position: relative; display: inline-flex; }
      .select-wrap .ydl-select-sm { appearance: none; -webkit-appearance: none; background: var(--ydl-muted); border: 1px solid var(--ydl-border); color: var(--ydl-foreground); font-size: 13px; padding: 7px 30px 7px 12px; border-radius: 8px; cursor: pointer; font-family: var(--font-sans); height: 36px; transition: border-color 140ms; }
      .select-wrap .ydl-select-sm:hover { border-color: var(--ydl-muted-foreground); }
      .select-wrap .ydl-select-sm:focus-visible { outline: 2px solid var(--ydl-ring); outline-offset: 2px; }
      .select-wrap .chev { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ydl-muted-foreground); display: inline-flex; }

      /* Buttons */
      .ydl-btn-primary { background: var(--ydl-primary); color: var(--ydl-primary-foreground); border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: opacity 160ms, transform 160ms; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
      .ydl-btn-primary:hover { opacity: .9; transform: translateY(-1px); }
      .ydl-btn-primary:active { transform: translateY(0); opacity: 1; }
      .ydl-btn-primary:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--ydl-ring) 38%, transparent); }
      .ydl-btn-outline { background: transparent; border: 1px solid var(--ydl-border); color: var(--ydl-foreground); border-radius: 8px; font-size: 14px; cursor: pointer; transition: border-color 160ms, background 160ms; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
      .ydl-btn-outline:hover { border-color: var(--ydl-primary); background: var(--ydl-muted); }
      .ydl-btn-outline:focus-visible { outline: none; border-color: var(--ydl-primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ydl-ring) 22%, transparent); }
      .ydl-btn-ghost { background: var(--ydl-muted); border: 1px solid var(--ydl-border); color: var(--ydl-foreground); border-radius: 8px; font-size: 13px; cursor: pointer; transition: background 160ms; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
      .ydl-btn-ghost:hover { background: var(--ydl-surface-2); }
      .ydl-btn-sm { height: 36px; padding: 0 14px; font-size: 13px; }
      .ydl-icon-btn { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--ydl-muted-foreground); border: none; background: transparent; cursor: pointer; transition: background 160ms, color 160ms; }
      .ydl-icon-btn:hover { background: var(--ydl-muted); color: var(--ydl-foreground); }
      .ydl-icon-btn:focus-visible { outline: 2px solid var(--ydl-ring); outline-offset: 2px; }

      /* Quality cards */
      .ydl-quality-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      @media (max-width: 639px) { .ydl-quality-grid { grid-template-columns: 1fr; } }
      .ydl-q-card { display: flex; cursor: pointer; position: relative; }
      .ydl-q-card input { position: absolute; opacity: 0; width: 0; height: 0; }
      .ydl-q-inner { flex: 1; border: 1px solid var(--ydl-border); border-radius: 8px; padding: 12px; transition: border-color 160ms, background 160ms; }
      .ydl-q-card:hover .ydl-q-inner { border-color: var(--ydl-muted-foreground); }
      .ydl-q-card input:checked ~ .ydl-q-inner { border-color: var(--ydl-primary); background: color-mix(in srgb, var(--ydl-primary) 8%, transparent); }
      .ydl-q-card input:focus-visible ~ .ydl-q-inner { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ydl-ring) 26%, transparent); }
      .ydl-q-radio { width: 16px; height: 16px; border-radius: 999px; border: 2px solid var(--ydl-border); flex-shrink: 0; transition: border-color 160ms, background 160ms; }
      .ydl-q-card input:checked ~ .ydl-q-inner .ydl-q-radio { border-color: var(--ydl-primary); background: radial-gradient(circle, var(--ydl-primary) 0 3.5px, transparent 4px); }
      .ydl-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--ydl-primary) 15%, transparent); color: var(--ydl-primary); font-weight: 500; line-height: 1.4; }

      /* Toggle */
      .ydl-toggle { display: inline-flex; cursor: pointer; position: relative; flex-shrink: 0; }
      .ydl-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
      .ydl-toggle-track { width: 44px; height: 24px; border-radius: 999px; background: var(--ydl-surface-3); position: relative; transition: background-color 160ms cubic-bezier(.2,.8,.2,1); }
      .ydl-toggle-thumb { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 999px; background: var(--ydl-foreground); transition: transform 160ms cubic-bezier(.2,.8,.2,1), background-color 160ms; }
      .ydl-toggle input:checked ~ .ydl-toggle-track { background: var(--ydl-primary); }
      .ydl-toggle input:checked ~ .ydl-toggle-track .ydl-toggle-thumb { transform: translateX(20px); background: var(--ydl-primary-foreground); }
      .ydl-toggle input:focus-visible ~ .ydl-toggle-track { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ydl-ring) 30%, transparent); }

      /* Details */
      .ydl-details > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--ydl-border); border-radius: 8px; background: var(--ydl-muted); font-size: 14px; font-weight: 500; color: var(--ydl-foreground); transition: background 160ms; }
      .ydl-details > summary:hover { background: var(--ydl-surface-2); }
      .ydl-details > summary::-webkit-details-marker { display: none; }
      .ydl-details-chevron { margin-left: auto; transition: transform 160ms cubic-bezier(.2,.8,.2,1); }
      .ydl-details[open] > summary .ydl-details-chevron { transform: rotate(180deg); }
      .ydl-details-body { padding: 8px 4px 4px; }
      .ydl-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 8px; }
      .ydl-toggle-row + .ydl-toggle-row { border-top: 1px solid var(--ydl-border); }

      /* Custom Checkbox */
      .ydl-check { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; border: 1.5px solid var(--ydl-border); border-radius: 4px; background: transparent; cursor: pointer; position: relative; flex-shrink: 0; margin: 0; transition: background-color 140ms cubic-bezier(.2,.8,.2,1), border-color 140ms cubic-bezier(.2,.8,.2,1); }
      .ydl-check:hover { border-color: var(--ydl-primary); }
      .ydl-check:checked { background: var(--ydl-primary); border-color: var(--ydl-primary); }
      .ydl-check:checked::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid var(--ydl-primary-foreground); border-width: 0 2px 2px 0; transform: rotate(45deg); }
      .ydl-check:focus-visible { outline: 2px solid var(--ydl-ring); outline-offset: 2px; }

      /* Playlist table */

                    <span class="ydl-tag">MP4</span>
                    <span class="text-[12px] text-[var(--ydl-muted-foreground)]">待下载</span>
                  </label>
                  <!-- Row 8 -->
                  <label class="pl-row" data-selected="true">
                    <input type="checkbox" class="ydl-check" checked>
                    <span class="font-mono text-[12px] text-[var(--ydl-muted-foreground)]">08</span>
                    <div class="thumb"><i data-lucide="play" class="w-3.5 h-3.5"></i></div>
                    <span class="text-[14px] text-[var(--ydl-foreground)] truncate">模块系统</span>
                    <span class="font-mono text-[13px] text-[var(--ydl-muted-foreground)]">9:20</span>
                    <span class="font-mono text-[13px] text-[var(--ydl-muted-foreground)]">230 MB</span>
                    <span class="ydl-tag">MP4</span>
                    <span class="text-[12px] text-[var(--ydl-muted-foreground)]">待下载</span>
                  </label>
                  <!-- Row 9 -->
                  <label class="pl-row" data-selected="true">
                    <input type="checkbox" class="ydl-check" checked>
                    <span class="font-mono text-[12px] text-[var(--ydl-muted-foreground)]">09</span>
                    <div class="thumb"><i data-lucide="play" class="w-3.5 h-3.5"></i></div>
                    <span class="text-[14px] text-[var(--ydl-foreground)] truncate">宏编程入门</span>
                    <span class="font-mono text-[13px] text-[var(--ydl-muted-foreground)]">14:05</span>
                    <span class="font-mono text-[13px] text-[var(--ydl-muted-foreground)]">350 MB</span>
                    <span class="ydl-tag">MP4</span>
                    <span class="text-[12px] text-[var(--ydl-muted-foreground)]">待下载</span>
                  </label>
                  <!-- Row 10 -->
                  <label class="pl-row" data-selected="true">
                    <input type="checkbox" class="ydl-check" checked>
                    <span class="font-mono text-[12px] text-[var(--ydl-muted-foreground)]">10</span>
                    <div class="thumb"><i data-lucide="play" class="w-3.5 h-3.5"></i></div>
                    <span class="text-[14px] text-[var(--ydl-foreground)] truncate">异步运行时</span>
                    <span class="font-mono text-[13px] text-[var(--ydl-muted-foreground)]">23:01</span>
                    <span class="font-mono text-[13px] text-[var(--ydl-muted-foreground)]">560 MB</span>
                    <span class="ydl-tag">MP4</span>
                    <span class="text-[12px] text-[var(--ydl-muted-foreground)]">待下载</span>
                  </label>
                </div>
              </div>

              <!-- Batch action toolbar (sticky) -->
              <div class="batch-bar flex-wrap" data-dom-id="batch-bar">
                <span class="text-[13px] text-[var(--ydl-foreground)] font-medium whitespace-nowrap">已选择 <span class="text-[var(--ydl-primary)] font-mono">8</span> <span class="text-[var(--ydl-muted-foreground)]">/</span> <span class="font-mono">10</span> 项</span>
                <div class="flex-1 min-w-[12px]"></div>
                <div class="select-wrap">
                  <select class="ydl-select-sm" data-dom-id="batch-quality-select" aria-label="清晰度">
                    <option>1080p</option>
                    <option>720p</option>
                    <option>480p</option>
                  </select>
                  <span class="chev"><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i></span>
                </div>
                <div class="select-wrap">
                  <select class="ydl-select-sm" data-dom-id="batch-format-select" aria-label="格式">
                    <option>MP4</option>
                    <option>MP3</option>
                    <option>WebM</option>
                  </select>
                  <span class="chev"><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i></span>
                </div>
                <button type="button" class="ydl-btn-outline ydl-btn-sm" data-dom-id="batch-export">
                  <i data-lucide="file-down" class="w-4 h-4"></i>
                  <span>导出列表</span>
                </button>
                <button type="button" class="ydl-btn-primary ydl-btn-sm" data-dom-id="batch-download">
                  <i data-lucide="download" class="w-4 h-4"></i>
                  <span>批量下载</span>
                </button>
              </div>
            </section>

            <!-- ============ Block 3: Quick Unified Options ============ -->
            <section class="ydl-panel-sm" data-dom-id="quick-options">
              <div class="flex items-center gap-2.5 mb-4">
                <i data-lucide="settings-2" class="w-[18px] h-[18px] text-[var(--ydl-muted-foreground)]"></i>
                <h3 class="text-[15px] font-semibold text-[var(--ydl-foreground)]">通用快速选项</h3>
                <span class="ydl-tag">影响所有选中项</span>
              </div>

              <!-- Universal save path -->
              <div class="mb-4">
                <label class="ydl-label" for="common-path-input">通用保存路径</label>
                <div class="flex items-stretch gap-2">
                  <div class="relative flex-1">
                    <i data-lucide="folder" class="w-[18px] h-[18px] absolute left-3 top-1/2 -translate-y-1/2 text-[var(--ydl-muted-foreground)] pointer-events-none"></i>
                    <input id="common-path-input" type="text" value="~/Downloads/Pulse/" class="ydl-input pl-10 pr-3 h-11 font-mono">
                  </div>
                  <button type="button" class="ydl-btn-ghost px-4 h-11 rounded-lg" aria-label="浏览文件夹">
                    <i data-lucide="folder-open" class="w-4 h-4"></i>
                    <span>浏览</span>
                  </button>
                </div>
              </div>

              <!-- Advanced options collapse -->
              <details class="ydl-details" open>
                <summary>
                  <i data-lucide="sliders-horizontal" class="w-[18px] h-[18px] text-[var(--ydl-muted-foreground)]"></i>
                  <span>高级选项</span>
                  <i data-lucide="chevron-down" class="w-4 h-4 ydl-details-chevron text-[var(--ydl-muted-foreground)]"></i>
                </summary>
                <div class="ydl-details-body">
                  <div class="ydl-toggle-row">
                    <div class="flex items-center gap-3">
                      <i data-lucide="captions" class="w-[18px] h-[18px] text-[var(--ydl-muted-foreground)]"></i>
                      <div>
                        <div class="text-[14px] text-[var(--ydl-foreground)]">下载字幕</div>
                        <div class="text-[12px] text-[var(--ydl-muted-foreground)]">为所有选中视频获取字幕</div>
                      </div>
                    </div>
                    <label class="ydl-toggle">
                      <input type="checkbox" checked aria-label="下载字幕">
                      <span class="ydl-toggle-track"><span class="ydl-toggle-thumb"></span></span>
                    </label>
                  </div>
                  <div class="ydl-toggle-row">
                    <div class="flex items-center gap-3">
                      <i data-lucide="image" class="w-[18px] h-[18px] text-[var(--ydl-muted-foreground)]"></i>
                      <div>
                        <div class="text-[14px] text-[var(--ydl-foreground)]">下载缩略图</div>
                        <div class="text-[12px] text-[var(--ydl-muted-foreground)]">为所有选中视频保存封面</div>
                      </div>
                    </div>
                    <label class="ydl-toggle">
                      <input type="checkbox" aria-label="下载缩略图">
                      <span class="ydl-toggle-track"><span class="ydl-toggle-thumb"></span></span>
                    </label>
                  </div>
                </div>
              </details>
            </section>

          </div>
        </main>
      </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
