    <style id="theme-vars">
/* ============================================================
   Pulse - Brand CSS
   Style: Dark Tech / Cyber-Cyan
   Prefix: ydl
   ============================================================ */

/* ---- Design Tokens ---- */
:root {
  /* Brand Primary (single hue - cyan) */
  --ydl-primary-hue: 188;
  --ydl-primary-sat: 100%;
  --ydl-primary-light: 44%;

  /* Primary scale tints */
  --ydl-primary-50: #e6fcff;
  --ydl-primary-100: #b3f7ff;
  --ydl-primary-200: #80f0ff;
  --ydl-primary-300: #4de8ff;
  --ydl-primary-400: #1adfff;
  --ydl-primary-500: #00c9e0;
  --ydl-primary-600: #00a3b8;
  --ydl-primary-700: #007d8c;
  --ydl-primary-800: #005760;
  --ydl-primary-900: #003238;

  /* Neutral scale (cool gray with slight blue tint) */
  --ydl-neutral-50: #f4f5fa;
  --ydl-neutral-100: #e5e7f0;
  --ydl-neutral-200: #c8cad8;
  --ydl-neutral-300: #a3a5b8;
  --ydl-neutral-400: #7a7d95;
  --ydl-neutral-500: #5a5d75;
  --ydl-neutral-600: #43455a;
  --ydl-neutral-700: #313346;
  --ydl-neutral-800: #222435;
  --ydl-neutral-900: #161825;
  --ydl-neutral-950: #0b0b14;

  /* State colors (semantic only, not brand) */
  --state-success: #2ebe85;
  --state-warning: #f5a623;
  --state-error: #f56565;
  --state-info: #4da3ff;

  /* Radius scale (restrained) */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "Noto Sans Mono", monospace;
  --font-display: "Inter", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;

  /* Shadows (static ≤ 0.05 alpha; floating may be deeper) */
  --shadow-static: 0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 1px rgba(0, 0, 0, 0.03);
  --shadow-float: 0 8px 24px -8px rgba(0, 0, 0, 0.4);
  --shadow-overlay: 0 24px 60px -20px rgba(0, 0, 0, 0.6);

  /* Spacing (8pt grid) */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* ---- Semantic Aliases (Light mode baseline) ---- */
  --ydl-background: var(--ydl-neutral-50);
  --ydl-foreground: var(--ydl-neutral-900);
  --ydl-card: #ffffff;
  --ydl-card-foreground: var(--ydl-neutral-900);
  --ydl-popover: #ffffff;
  --ydl-popover-foreground: var(--ydl-neutral-900);
  --ydl-primary: var(--ydl-primary-500);
  --ydl-primary-foreground: #ffffff;
  --ydl-muted: var(--ydl-neutral-100);
  --ydl-muted-foreground: var(--ydl-neutral-500);
  --ydl-border: var(--ydl-neutral-200);
  --ydl-input: var(--ydl-neutral-200);
  --ydl-ring: var(--ydl-primary-500);

  --ydl-radius-small: var(--radius-sm);
  --ydl-radius-medium: var(--radius-md);
  --ydl-radius-large: var(--radius-lg);

  /* Extended light surface tokens for layered depth */
  --ydl-surface: #ffffff;
  --ydl-surface-2: #f4f5fa;
  --ydl-surface-3: #e5e7f0;
  --ydl-link: #161825;
  --ydl-link-2: #5a5d75;
  --ydl-link-3: #7a7d95;
  --ydl-line: #c8cad8;

  /* Light-optimized shadows */
  --shadow-static: 0 1px 2px rgba(0, 0, 0, 0.03), 0 1px 1px rgba(0, 0, 0, 0.02);
  --shadow-float: 0 4px 16px -4px rgba(0, 0, 0, 0.08);
  --shadow-overlay: 0 12px 40px -8px rgba(0, 0, 0, 0.12);
}

/* ---- Dark Mode (primary theme) ---- */
.dark {
  --ydl-background: #0b0b14;
  --ydl-foreground: #e8eaf6;
  --ydl-card: #13131e;
  --ydl-card-foreground: #e8eaf6;
  --ydl-popover: #1a1a2b;
  --ydl-popover-foreground: #e8eaf6;
  --ydl-primary: #00c9e0;
  --ydl-primary-foreground: #0b0b14;
  --ydl-muted: #1b1b2b;
  --ydl-muted-foreground: #9090b0;
  --ydl-border: #252538;
  --ydl-input: #252538;
  --ydl-ring: #00c9e0;

  /* Extended dark surface tokens for layered depth */
  --ydl-surface: #13131e;
  --ydl-surface-2: #1b1b2b;
  --ydl-surface-3: #252538;
  --ydl-ink: #e8eaf6;
  --ydl-ink-2: #9090b0;
  --ydl-ink-3: #5a5d7a;
  --ydl-line: #252538;
}

/* ---- Typography Classes ---- */
.font-display { font-family: var(--font-display); }
.font-sans { font-family: var(--font-sans); }
.font-mono { font-family: var(--font-mono); }

.text-display { font-size: clamp(32px, 4vw, 48px); line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; }
.text-h1 { font-size: clamp(24px, 3vw, 36px); line-height: 1.2; font-weight: 600; letter-spacing: -0.015em; }
.text-h2 { font-size: clamp(20px, 2.2vw, 28px); line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; }
.text-h3 { font-size: 18px; line-height: 1.4; font-weight: 600; }
.text-body { font-size: 14px; line-height: 1.6; font-weight: 400; }
.text-body-sm { font-size: 13px; line-height: 1.55; font-weight: 400; }
.text-caption { font-size: 12px; line-height: 1.5; font-weight: 400; }
.text-mono { font-size: 13px; line-height: 1.5; font-weight: 500; font-family: var(--font-mono); }

    </style>

  }

    <style id="critical-layout">
      /* ===== App Shell Frame (survives without Tailwind) ===== */
      html, body { height: 100%; }
      body { background: var(--ydl-background); color: var(--ydl-foreground); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
      .app-shell { display: flex; height: 100vh; overflow: hidden; }
      .app-sidebar { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--ydl-border); background: var(--ydl-card); }
      .app-main-area { flex: 1 1 0%; display: flex; flex-direction: column; min-width: 0; }
      .app-topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 56px; border-bottom: 1px solid var(--ydl-border); flex-shrink: 0; }
      .app-content { flex: 1 1 0%; overflow-y: auto; padding: 24px; }

      /* ===== Nav (single-emphasis active state via data-active slot) ===== */
      .nav-item { color: var(--ydl-muted-foreground); text-decoration: none; transition: background-color 140ms cubic-bezier(.2,.8,.2,1), color 140ms cubic-bezier(.2,.8,.2,1); }
      .nav-item:hover { background: var(--ydl-muted); color: var(--ydl-foreground); }
      .nav-item[data-active="true"] { background: var(--ydl-muted); color: var(--ydl-foreground); }
      .nav-item[data-active="true"] .nav-icon { color: var(--ydl-primary); }
      .nav-item:focus-visible { outline: 2px solid var(--ydl-ring); outline-offset: 2px; }

      /* ===== Custom Checkbox ===== */
      .ydl-check { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; border: 1.5px solid var(--ydl-border); border-radius: 4px; background: transparent; cursor: pointer; position: relative; flex-shrink: 0; margin: 0; transition: background-color 140ms cubic-bezier(.2,.8,.2,1), border-color 140ms cubic-bezier(.2,.8,.2,1); }
      .ydl-check:hover { border-color: var(--ydl-primary); }
      .ydl-check:checked { background: var(--ydl-primary); border-color: var(--ydl-primary); }
      .ydl-check:checked::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid var(--ydl-primary-foreground); border-width: 0 2px 2px 0; transform: rotate(45deg); }
      .ydl-check:focus-visible { outline: 2px solid var(--ydl-ring); outline-offset: 2px; }

      /* ===== Playlist Table ===== */
      .pl-head, .pl-row { display: grid; grid-template-columns: 28px 28px 64px minmax(0,1fr) 60px 68px 52px 64px; align-items: center; gap: 12px; padding: 10px 14px; }
      .pl-head { font-size: 12px; color: var(--ydl-muted-foreground); border-bottom: 1px solid var(--ydl-border); font-weight: 500; }
      .pl-row { border-bottom: 1px solid var(--ydl-border); transition: background-color 120ms cubic-bezier(.2,.8,.2,1); }
      .pl-row:last-child { border-bottom: none; }
      .pl-row:hover { background: var(--ydl-muted); }
      .pl-row[data-selected="true"] { background: color-mix(in srgb, var(--ydl-primary) 5%, transparent); box-shadow: inset 2px 0 0 var(--ydl-primary); }
      .pl-row[data-selected="true"]:hover { background: color-mix(in srgb, var(--ydl-primary) 9%, transparent); }

      /* ===== Sticky Batch Toolbar ===== */
      .batch-bar { position: sticky; bottom: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--ydl-card); border: 1px solid var(--ydl-border); border-radius: var(--radius-lg); }

      /* ===== Buttons ===== */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: background-color 140ms cubic-bezier(.2,.8,.2,1), border-color 140ms cubic-bezier(.2,.8,.2,1), transform 140ms cubic-bezier(.2,.8,.2,1), color 140ms cubic-bezier(.2,.8,.2,1); }
      .btn-primary { background: var(--ydl-primary); color: var(--ydl-primary-foreground); }
      .btn-primary:hover { background: var(--ydl-primary-400); transform: translateY(-1px); }
      .btn-primary:active { transform: translateY(0); }
      .btn-outline { background: transparent; border-color: var(--ydl-border); color: var(--ydl-foreground); }
      .btn-outline:hover { background: var(--ydl-muted); border-color: var(--ydl-muted-foreground); }
      .btn:focus-visible { outline: 2px solid var(--ydl-ring); outline-offset: 2px; }

      /* ===== Select wrapper ===== */
      .select-wrap { position: relative; display: inline-flex; }
      .ydl-select { appearance: none; -webkit-appearance: none; background: var(--ydl-muted); border: 1px solid var(--ydl-border); color: var(--ydl-foreground); font-size: 13px; padding: 7px 30px 7px 12px; border-radius: 8px; cursor: pointer; font-family: var(--font-sans); }
      .ydl-select:hover { border-color: var(--ydl-muted-foreground); }
      .ydl-select:focus-visible { outline: 2px solid var(--ydl-ring); outline-offset: 2px; }
      .select-wrap .chev { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ydl-muted-foreground); display: inline-flex; }

      /* ===== URL input ===== */
      .ydl-input { transition: border-color 140ms cubic-bezier(.2,.8,.2,1), box-shadow 140ms cubic-bezier(.2,.8,.2,1); }
      .ydl-input:focus { outline: none; border-color: var(--ydl-primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ydl-ring) 35%, transparent); }

      /* ===== Tag ===== */
      .ydl-tag { display: inline-flex; align-items: center; justify-content: center; padding: 2px 8px; border-radius: 4px; font-size: 12px; background: var(--ydl-muted); color: var(--ydl-muted-foreground); line-height: 1.4; }

      /* ===== Thumbnail placeholder ===== */
      .thumb { width: 64px; height: 40px; border-radius: 6px; background: var(--ydl-muted); display: flex; align-items: center; justify-content: center; color: var(--ydl-muted-foreground); flex-shrink: 0; }

      /* ===== Meta pill ===== */
      .meta-pill { display: inline-flex; align-items: center; gap: 6px; }

      /* ===== Icon button (topbar) ===== */
      .icon-btn { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--ydl-muted-foreground); border: none; background: transparent; cursor: pointer; transition: background-color 140ms cubic-bezier(.2,.8,.2,1), color 140ms cubic-bezier(.2,.8,.2,1); }
      .icon-btn:hover { background: var(--ydl-muted); color: var(--ydl-foreground); }
      .icon-btn:focus-visible { outline: 2px solid var(--ydl-ring); outline-offset: 2px; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: 0.01ms !important; }
      }
    </style>
</head>

        <!-- ===== Page Content (Playlist) ===== -->
