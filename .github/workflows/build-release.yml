name: Build Desktop Binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
            artifact: Pulse-macos-x86_64
            bundle-path: src-tauri/target/x86_64-apple-darwin/release/bundle
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            artifact: Pulse-macos-aarch64
            bundle-path: src-tauri/target/aarch64-apple-darwin/release/bundle
          - name: Windows x86_64
            os: windows-latest
            target: ""
            artifact: Pulse-windows-x86_64
            bundle-path: src-tauri/target/release/bundle

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle-path }}/**/*.dmg
            ${{ matrix.bundle-path }}/**/*.app.tar.gz
            ${{ matrix.bundle-path }}/**/*.exe
            ${{ matrix.bundle-path }}/**/*.msi
